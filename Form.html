<html>
<head>
	<title> Basic form </title>
</head>
<body bgcolor="gray" >
<body align="center">
<blockquote>
<table>
<center>
	<h2><marquee direction="left"> Student Registration Form </marquee></h2>
<form>
	<big><label> Name:</label></big>
	<input type="text" name="name">
	<br><br>
	
	<big><label> Email:</label></big>
	<input type="Email" name="Email">
	<br><br>
	
	<big><label> Password:</label></big>
	<input type="Password" name="Password">
	<br><br>
	
	<big><label> Age:</label></big>
	<input type="Number" name="Age">
	<br><br>
	
	<big><label> Gender:</label></big>
	<input type="radio" name="Password" value="male">male
	
	
	
	<big><input type="radio" name="Password" value="Female">female</big>
	<br><br>
	
	<big><label> Course:</label></big>
	<select name="course">
	<option name="MCA" >MCA</option>
	<option name="BCA" >BCA</option>
	<option name="BTECH" >B.TECH</option>
	</select>
	<br><br>
	
	
	<big><label> Address::</label></big>
	<textarea name="address"></textarea>
	<br><br>
	
	<big><label> Hobby:</label></big>
	<input type="Check box"  >
	<br><br>
	
	
	<big><label>File</label></big>
	<input type="file">
	<br></br>
	
	<big><label>Range</label></big>
	<big>0<input type="range">100</big>
	<br></br>
	
	<big><label>Date</label></big>
	<input type="date">
	<br></br>
	
	<big><label>Number</label></big>
	<input type="number">
	<br></br>
	
	
	<input type="submit" value="submit">
	<input type="reset" value="reset">
	
	
	
</table>
</form>
</blockquote>	
</body>
</html>
